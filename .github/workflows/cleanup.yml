name: Clean Workflows and Releases

on:
  workflow_dispatch:
    inputs:
      cleanup_target:
        description: 'Choose what to delete / clear:'
        required: true
        type: choice
        options:
          - 'Both (Action History & Releases)'
          - 'Action History Only'
          - 'Releases & Tags Only'
        default: 'Both (Action History & Releases)'

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    name: Purge Selected Resources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete Workflow Run History
        if: ${{ inputs.cleanup_target == 'Both (Action History & Releases)' || inputs.cleanup_target == 'Action History Only' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_RUN_ID="${{ github.run_id }}"
          REPO="${{ github.repository }}"
          echo "Scanning workflow runs for repository: $REPO (preserving current cleanup run: $CURRENT_RUN_ID)..."

          RUNS=$(gh run list --repo "$REPO" --limit 1000 --json databaseId -q '.[].databaseId' || true)
          for RUN_ID in $RUNS; do
            if [ "$RUN_ID" != "$CURRENT_RUN_ID" ]; then
              echo "Deleting workflow run: $RUN_ID"
              gh run delete "$RUN_ID" --repo "$REPO" || true
            fi
          done
          echo "Action history cleanup completed."

      - name: Delete Releases and Release Assets
        if: ${{ inputs.cleanup_target == 'Both (Action History & Releases)' || inputs.cleanup_target == 'Releases & Tags Only' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          echo "Scanning releases for repository: $REPO..."

          RELEASES=$(gh release list --repo "$REPO" --limit 1000 --json tagName -q '.[].tagName' || true)
          for TAG in $RELEASES; do
            echo "Deleting release: $TAG"
            gh release delete "$TAG" --repo "$REPO" --cleanup-tag -y || true
          done
          echo "Releases cleanup completed."

      - name: Delete Git Tags
        if: ${{ inputs.cleanup_target == 'Both (Action History & Releases)' || inputs.cleanup_target == 'Releases & Tags Only' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching remote tags..."
          git fetch --tags --force || true
          TAGS=$(git tag -l)
          for T in $TAGS; do
            echo "Deleting remote git tag: $T"
            git push origin --delete "$T" || true
            git tag -d "$T" || true
          done
          echo "All git tags purged successfully."
