name: Build and Release Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 21 with Dependency Cache
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Configure Android SDK and Build-Tools Cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/platforms/android-36*
            /usr/local/lib/android/sdk/build-tools/36*
          key: android-sdk-36-${{ runner.os }}

      - name: Accept Android SDK Licenses
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          mkdir -p "${ANDROID_SDK_ROOT}/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "${ANDROID_SDK_ROOT}/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "${ANDROID_SDK_ROOT}/licenses/android-sdk-preview-license"

      - name: Set up Gradle with Full Build & Configuration Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Generate Signing Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "${GITHUB_WORKSPACE}/my-upload-key.jks"
          elif [ ! -f "${GITHUB_WORKSPACE}/my-upload-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/my-upload-key.jks" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${STORE_PASSWORD}" \
              -keypass "${KEY_PASSWORD}" \
              -dname "CN=AudioEQ, OU=Mobile, O=AudioEQ, L=SanFrancisco, S=CA, C=US"
          fi
          if [ ! -f "${GITHUB_WORKSPACE}/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "${GITHUB_WORKSPACE}/debug.keystore" \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass android \
              -keypass android \
              -dname "CN=Android Debug, O=Android, C=US"
          fi
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}

      - name: Build Signed Release APK (Max Free Runner Performance)
        run: |
          GRADLE_CMD="gradle"
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            GRADLE_CMD="./gradlew"
          fi
          $GRADLE_CMD assembleRelease \
            --parallel \
            --build-cache \
            --configuration-cache \
            -Dorg.gradle.jvmargs="-Xmx12g -XX:+UseParallelGC -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8 -Djava.awt.headless=true" \
            -Dorg.gradle.workers.max=4 \
            -Dorg.gradle.vfs.watch=true \
            -Djava.awt.headless=true \
            -Pkotlin.compiler.execution.strategy=daemon \
            -Pksp.useKSP2=true \
            -x lint \
            -x lintVitalRelease \
            -x test
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}

      - name: Generate Unique Tag & Prepare Release APK
        id: prepare_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
          UNIQUE_TAG="v1.0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}-${TIMESTAMP}"
          RELEASE_APK_NAME="AudioEQ-${UNIQUE_TAG}.apk"
          cp "$APK_PATH" "${GITHUB_WORKSPACE}/${RELEASE_APK_NAME}"
          echo "apk_path=${GITHUB_WORKSPACE}/${RELEASE_APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${RELEASE_APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${UNIQUE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Create New GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: "Audio EQ ${{ steps.prepare_apk.outputs.tag_name }}"
          body: |
            ### Audio EQ Android Release (`${{ steps.prepare_apk.outputs.tag_name }}`)
            - **Commit**: `${{ github.sha }}` (Run #${{ github.run_number }}.${{ github.run_attempt }})
            - **10-Band Master Equalizer**: Bass (20–250 Hz), Mids (250 Hz–4 kHz), Treble (4–12 kHz), Air (12–20 kHz)
            - **Mid/Side Stereo Width**: Linkwitz-Riley 4th-order crossovers + sub-60 Hz mono protection
            - **Presets**: Flat, Balanced Deep, Bass Boost, Vocal Clarity, Percussion Clarity (Tabla tuned), Custom
            - **4 Engine Modes**: Legacy, Global, ADB/Shizuku, and Root DSP
          files: ${{ steps.prepare_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
